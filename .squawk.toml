# Lints new migrations only (.github/workflows/squawk.yml). Existing ones are applied history and stay as they are.
pg_version = "17.0"
# Style and timeout rules fire on every file; the lock and rewrite rules are what the check is for.
excluded_rules = [
  "prefer-robust-stmts",
  "prefer-bigint-over-int",
  "prefer-bigint-over-smallint",
  "prefer-identity",
  "require-lock-timeout",
  "require-statement-timeout",
]
