name: nytka

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nytka
      POSTGRES_USER: nytka
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The Ukrainian search dictionary, optional: run scripts/fetch-uk-dictionary.sh to fill ./tsearch_data.
      # Without the files Postgres still starts and search matches Cyrillic words exactly.
      - ./tsearch_data:/nytka-dictionary:ro
    # Links the dictionary files into the stock image's tsearch_data when they exist, then starts Postgres as usual.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in uk_ua.dict uk_ua.affix; do
          if [ -s /nytka-dictionary/$$f ]; then ln -sf /nytka-dictionary/$$f /usr/local/share/postgresql/tsearch_data/$$f; fi
        done
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nytka -d nytka"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: "ghcr.io/nytka-app/server:${NYTKA_VERSION:-latest}"
    # `docker compose up --build` builds from a checkout instead of pulling.
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres allows 100 connections by default. The search indexer and its queries keep 2 of their own,
      # so the server's main pool is capped well below that.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nytka;Username=nytka;Password=${POSTGRES_PASSWORD};Maximum Pool Size=50"
      Nytka__AdminToken: "${Nytka__AdminToken:?set Nytka__AdminToken in .env (32+ characters: openssl rand -hex 24)}"
      Nytka__Stt__Url: "${Nytka__Stt__Url:?set Nytka__Stt__Url in .env}"
      # Everything below is optional and empty by default. An empty value counts as unset: the server's own
      # default applies and the app can edit the setting. A value here locks the setting to it.
      Nytka__Stt__ApiKey: "${Nytka__Stt__ApiKey:-}"
      Nytka__Stt__Model: "${Nytka__Stt__Model:-}"
      Nytka__Stt__Language: "${Nytka__Stt__Language:-}"
      Nytka__Conversations__Gap: "${Nytka__Conversations__Gap:-}"
      Nytka__Audio__RetentionDays: "${Nytka__Audio__RetentionDays:-}"
      Nytka__Mute__Windows: "${Nytka__Mute__Windows:-}"
      Nytka__User__TimeZone: "${Nytka__User__TimeZone:-}"
      Nytka__Llm__BaseUrl: "${Nytka__Llm__BaseUrl:-}"
      Nytka__Llm__ApiKey: "${Nytka__Llm__ApiKey:-}"
      Nytka__Llm__Model: "${Nytka__Llm__Model:-}"
      Nytka__Llm__OutputLanguage: "${Nytka__Llm__OutputLanguage:-}"
      Nytka__Llm__JsonMode: "${Nytka__Llm__JsonMode:-}"
      Nytka__Llm__TimeoutSeconds: "${Nytka__Llm__TimeoutSeconds:-}"
      Nytka__Llm__MaxInputChars: "${Nytka__Llm__MaxInputChars:-}"
      Nytka__Llm__BackfillDays: "${Nytka__Llm__BackfillDays:-}"
      Nytka__Memories__Enabled: "${Nytka__Memories__Enabled:-}"
      Nytka__Memories__UserName: "${Nytka__Memories__UserName:-}"
      Nytka__Digest__Enabled: "${Nytka__Digest__Enabled:-}"
      Nytka__Digest__Hour: "${Nytka__Digest__Hour:-}"
      Nytka__Search__Dictionary: "${Nytka__Search__Dictionary:-}"
      Nytka__Voice__Enabled: "${Nytka__Voice__Enabled:-}"
      Nytka__Voice__UserThreshold: "${Nytka__Voice__UserThreshold:-}"
      Nytka__Voice__LearnThreshold: "${Nytka__Voice__LearnThreshold:-}"
      Nytka__Voice__Learn: "${Nytka__Voice__Learn:-}"
      Nytka__Voice__MinSegmentSeconds: "${Nytka__Voice__MinSegmentSeconds:-}"
      Nytka__Voice__ModelPath: "${Nytka__Voice__ModelPath:-}"
    ports:
      # Loopback by default: put a reverse proxy in front, or set NYTKA_BIND to a tailnet address.
      - "${NYTKA_BIND:-127.0.0.1}:${NYTKA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
