name: nytka

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nytka
      POSTGRES_USER: nytka
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The Ukrainian search dictionary, optional: run scripts/fetch-uk-dictionary.sh to fill ./tsearch_data.
      # Without the files Postgres still starts and search matches Cyrillic words exactly.
      - ./tsearch_data:/nytka-dictionary:ro
    # Links the dictionary files into the stock image's tsearch_data when they exist, then starts Postgres as usual.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for f in uk_ua.dict uk_ua.affix; do
          if [ -s /nytka-dictionary/$$f ]; then ln -sf /nytka-dictionary/$$f /usr/local/share/postgresql/tsearch_data/$$f; fi
        done
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nytka -d nytka"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: "ghcr.io/nytka-app/server:${NYTKA_VERSION:-latest}"
    # `docker compose up --build` builds from a checkout instead of pulling.
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Postgres allows 100 connections by default. The search indexer and its queries keep 2 of their own,
      # so the server's main pool is capped well below that.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nytka;Username=nytka;Password=${POSTGRES_PASSWORD};Maximum Pool Size=50"
      Nytka__AdminToken: "${Nytka__AdminToken:?set Nytka__AdminToken in .env (32+ characters: openssl rand -hex 24)}"
      Nytka__Stt__Url: "${Nytka__Stt__Url:?set Nytka__Stt__Url in .env}"
      # Everything below is optional and empty by default. An empty value counts as unset: the server's own
      # default applies and the app can edit the setting. A value here locks the setting to it.
      Nytka__Stt__ApiKey: "${Nytka__Stt__ApiKey:-}"
      Nytka__Stt__Model: "${Nytka__Stt__Model:-}"
      Nytka__Stt__Language: "${Nytka__Stt__Language:-}"
      Nytka__Stt__Vocabulary: "${Nytka__Stt__Vocabulary:-}"
      Nytka__Stt__SonioxApiKey: "${Nytka__Stt__SonioxApiKey:-}"
      Nytka__Stt__SonioxBaseUrl: "${Nytka__Stt__SonioxBaseUrl:-}"
      Nytka__Stt__Prices: "${Nytka__Stt__Prices:-}"
      Nytka__Stt__MonthlyBudgetUsd: "${Nytka__Stt__MonthlyBudgetUsd:-}"
      Nytka__Stt__BudgetWarningPercent: "${Nytka__Stt__BudgetWarningPercent:-}"
      Nytka__Stt__BudgetModel: "${Nytka__Stt__BudgetModel:-}"
      Nytka__Stt__Batch__MinSeconds: "${Nytka__Stt__Batch__MinSeconds:-}"
      Nytka__Stt__Batch__MaxSeconds: "${Nytka__Stt__Batch__MaxSeconds:-}"
      Nytka__Stt__Batch__HardMaxSeconds: "${Nytka__Stt__Batch__HardMaxSeconds:-}"
      Nytka__Stt__Batch__LongSilenceSeconds: "${Nytka__Stt__Batch__LongSilenceSeconds:-}"
      Nytka__Conversations__Gap: "${Nytka__Conversations__Gap:-}"
      Nytka__Audio__RetentionDays: "${Nytka__Audio__RetentionDays:-}"
      Nytka__Labeling__KeepClips: "${Nytka__Labeling__KeepClips:-}"
      Nytka__Eval__GoldenDays: "${Nytka__Eval__GoldenDays:-}"
      Nytka__Mute__Windows: "${Nytka__Mute__Windows:-}"
      Nytka__User__TimeZone: "${Nytka__User__TimeZone:-}"
      Nytka__Llm__BaseUrl: "${Nytka__Llm__BaseUrl:-}"
      Nytka__Llm__ApiKey: "${Nytka__Llm__ApiKey:-}"
      Nytka__Llm__Model: "${Nytka__Llm__Model:-}"
      Nytka__Llm__OutputLanguage: "${Nytka__Llm__OutputLanguage:-}"
      Nytka__Llm__JsonMode: "${Nytka__Llm__JsonMode:-}"
      Nytka__Llm__TimeoutSeconds: "${Nytka__Llm__TimeoutSeconds:-}"
      Nytka__Llm__MaxInputChars: "${Nytka__Llm__MaxInputChars:-}"
      Nytka__Llm__BackfillDays: "${Nytka__Llm__BackfillDays:-}"
      Nytka__Memories__Enabled: "${Nytka__Memories__Enabled:-}"
      Nytka__Memories__UserName: "${Nytka__Memories__UserName:-}"
      Nytka__People__SuggestNames: "${Nytka__People__SuggestNames:-}"
      Nytka__People__AutoApplyNames: "${Nytka__People__AutoApplyNames:-}"
      Nytka__People__AutoApplyConfidence: "${Nytka__People__AutoApplyConfidence:-}"
      Nytka__People__CardMinConversations: "${Nytka__People__CardMinConversations:-}"
      Nytka__People__Facts: "${Nytka__People__Facts:-}"
      Nytka__Tags__Suggest: "${Nytka__Tags__Suggest:-}"
      Nytka__Tags__Auto: "${Nytka__Tags__Auto:-}"
      Nytka__Privacy__Hide: "${Nytka__Privacy__Hide:-}"
      Nytka__Topics__Enabled: "${Nytka__Topics__Enabled:-}"
      Nytka__Rollups__Enabled: "${Nytka__Rollups__Enabled:-}"
      Nytka__Events__SilenceMinutes: "${Nytka__Events__SilenceMinutes:-}"
      Nytka__Timeline__Scenes: "${Nytka__Timeline__Scenes:-}"
      Nytka__Summary__Templates__Enabled: "${Nytka__Summary__Templates__Enabled:-}"
      Nytka__Summary__Templates__Default: "${Nytka__Summary__Templates__Default:-}"
      Nytka__Summary__Templates__Meeting: "${Nytka__Summary__Templates__Meeting:-}"
      Nytka__Summary__Templates__Lecture: "${Nytka__Summary__Templates__Lecture:-}"
      Nytka__Summary__Templates__Doctor: "${Nytka__Summary__Templates__Doctor:-}"
      Nytka__Summary__Templates__Call: "${Nytka__Summary__Templates__Call:-}"
      Nytka__Calendar__IcsUrl: "${Nytka__Calendar__IcsUrl:-}"
      Nytka__Calendar__BriefMinutes: "${Nytka__Calendar__BriefMinutes:-}"
      Nytka__Digest__Enabled: "${Nytka__Digest__Enabled:-}"
      Nytka__Digest__Hour: "${Nytka__Digest__Hour:-}"
      Nytka__Insights__TrustedAfterDays: "${Nytka__Insights__TrustedAfterDays:-}"
      Nytka__Nudges__Enabled: "${Nytka__Nudges__Enabled:-}"
      Nytka__Nudges__QuietFrom: "${Nytka__Nudges__QuietFrom:-}"
      Nytka__Nudges__QuietTo: "${Nytka__Nudges__QuietTo:-}"
      Nytka__Search__Dictionary: "${Nytka__Search__Dictionary:-}"
      Nytka__Embeddings__BaseUrl: "${Nytka__Embeddings__BaseUrl:-}"
      Nytka__Embeddings__ApiKey: "${Nytka__Embeddings__ApiKey:-}"
      Nytka__Embeddings__Model: "${Nytka__Embeddings__Model:-}"
      Nytka__Embeddings__Dimensions: "${Nytka__Embeddings__Dimensions:-}"
      Nytka__Embeddings__QueryPrefix: "${Nytka__Embeddings__QueryPrefix:-}"
      Nytka__Embeddings__MaxDistance: "${Nytka__Embeddings__MaxDistance:-}"
      Nytka__Embeddings__TimeoutSeconds: "${Nytka__Embeddings__TimeoutSeconds:-}"
      Nytka__Embeddings__BatchSize: "${Nytka__Embeddings__BatchSize:-}"
      Nytka__Voice__Enabled: "${Nytka__Voice__Enabled:-}"
      Nytka__Voice__UserThreshold: "${Nytka__Voice__UserThreshold:-}"
      Nytka__Voice__LearnThreshold: "${Nytka__Voice__LearnThreshold:-}"
      Nytka__Voice__Learn: "${Nytka__Voice__Learn:-}"
      Nytka__Voice__MinSegmentSeconds: "${Nytka__Voice__MinSegmentSeconds:-}"
      Nytka__Voice__NewPrintBelow: "${Nytka__Voice__NewPrintBelow:-}"
      Nytka__Voice__MaxPrints: "${Nytka__Voice__MaxPrints:-}"
      Nytka__Voice__ModelPath: "${Nytka__Voice__ModelPath:-}"
      Nytka__People__VoiceMatching: "${Nytka__People__VoiceMatching:-}"
      Nytka__People__VoiceThreshold: "${Nytka__People__VoiceThreshold:-}"
      Nytka__Speech__Mode: "${Nytka__Speech__Mode:-}"
      Nytka__Speech__MediaThreshold: "${Nytka__Speech__MediaThreshold:-}"
    ports:
      # Loopback by default: put a reverse proxy in front, or set NYTKA_BIND to a tailnet address.
      - "${NYTKA_BIND:-127.0.0.1}:${NYTKA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # The `local` profile: a speech-to-text server and a language model server that need no account
  # and no API key, for Nytka__Stt__Url and Nytka__Llm__BaseUrl to point at (docs/how-to/install.md, "Install
  # in 15 minutes"). Off unless COMPOSE_PROFILES=local is set or `docker compose --profile local ...` is
  # used; scripts/install.sh does both. Slower and less accurate than a hosted provider.
  stt-local:
    image: "fedirz/faster-whisper-server:${NYTKA_STT_LOCAL_VERSION:-0.5.0-cpu}"
    profiles: ["local"]
    restart: unless-stopped
    environment:
      # A Hugging Face faster-whisper repo id; the server downloads it on the first request.
      WHISPER__MODEL: "${NYTKA_STT_LOCAL_MODEL:-Systran/faster-whisper-small}"
    volumes:
      - stt-local-data:/root/.cache/huggingface
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python3.12", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  llm-local:
    image: "ollama/ollama:${NYTKA_LLM_LOCAL_VERSION:-0.3.14}"
    profiles: ["local"]
    restart: unless-stopped
    volumes:
      - llm-local-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  stt-local-data:
  llm-local-data:
