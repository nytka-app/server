name: nytka

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nytka
      POSTGRES_USER: nytka
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The Ukrainian search dictionary. Run scripts/fetch-uk-dictionary.sh once first: without the files
      # Compose stops here (create_host_path: false) instead of creating directories in their place.
      - type: bind
        source: ./tsearch_data/uk_ua.dict
        target: /usr/local/share/postgresql/tsearch_data/uk_ua.dict
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./tsearch_data/uk_ua.affix
        target: /usr/local/share/postgresql/tsearch_data/uk_ua.affix
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nytka -d nytka"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    image: "ghcr.io/nytka-app/server:${NYTKA_VERSION:-latest}"
    # `docker compose up --build` builds from a checkout instead of pulling.
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=nytka;Username=nytka;Password=${POSTGRES_PASSWORD}"
      Nytka__AdminToken: "${Nytka__AdminToken:?set Nytka__AdminToken in .env (32+ characters: openssl rand -hex 24)}"
      Nytka__Stt__Url: "${Nytka__Stt__Url:?set Nytka__Stt__Url in .env}"
      Nytka__Stt__ApiKey: "${Nytka__Stt__ApiKey:-}"
      Nytka__Stt__Model: "${Nytka__Stt__Model:-}"
      Nytka__Stt__Language: "${Nytka__Stt__Language:-}"
      Nytka__Conversations__Gap: "${Nytka__Conversations__Gap:-00:02:00}"
      Nytka__Audio__RetentionDays: "${Nytka__Audio__RetentionDays:-14}"
    ports:
      # Loopback by default: put a reverse proxy in front, or set NYTKA_BIND to a tailnet address.
      - "${NYTKA_BIND:-127.0.0.1}:${NYTKA_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
