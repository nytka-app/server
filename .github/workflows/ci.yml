name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # The search tests mount the Ukrainian dictionary into their Postgres; NYTKA_REQUIRE_DICTIONARY makes
      # a missing file fail them instead of skipping them.
      - run: scripts/fetch-uk-dictionary.sh
      # Storage tests start Postgres through Testcontainers; the hosted runner has Docker.
      - run: dotnet test --no-build -c Release
        env:
          NYTKA_REQUIRE_DICTIONARY: "1"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks-action needs a paid license for organisation repositories; the binary itself is MIT.
      - name: Scan the history with gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
      # Prints short hashes only: echoing the offending address would publish it in the log.
      - name: Every commit uses a GitHub noreply address
        run: |
          bad=$(git log --format='%h %ae%n%h %ce' \
            | grep -vE ' ([^ @]+@users\.noreply\.github\.com|noreply@github\.com)$' || true)
          if [ -n "$bad" ]; then
            echo "Commits with an address that is not a GitHub noreply one:"
            echo "$bad" | cut -d' ' -f1 | sort -u
            exit 1
          fi
